name: Bootstrap Keystore (one-time)

on:
  workflow_dispatch: {}

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore with random password
        run: |
          PW=$(openssl rand -base64 18 | tr -d "\n")
          keytool -genkeypair -v -keystore evolia-release.p12 -storetype PKCS12 \
            -alias evolia -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=jianglinyuan, OU=cat, O=meow, L=shanghai, ST=shanghai, C=CN"
          B64=$(base64 -w0 evolia-release.p12)
          {
            echo "KEYSTORE_P12_BASE64<<KEOF"
            echo "$B64"
            echo "KEOF"
          } >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "keystore generated"

      - name: Set secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh secret set KEYSTORE_P12_BASE64 --repo jnnjly/evolia --body "$KEYSTORE_P12_BASE64"
          gh secret set KEYSTORE_PASSWORD --repo jnnjly/evolia --body "$KEYSTORE_PASSWORD"
          gh secret list --repo jnnjly/evolia

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: evolia-release-keystore
          path: |
            evolia-release.p12
            password.txt
